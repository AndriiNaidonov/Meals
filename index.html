<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#12151a">
<title>Харчування</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#12151a; --bg2:#1a1f27; --bg3:#232a34; --line:#2e3742;
  --tx:#e8edf3; --tx2:#9aa7b6; --tx3:#6b7887;
  --ac:#5eb3f6; --ok:#4ec98a; --warn:#f2b23c; --bad:#f2685c; --pur:#b08cf5;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ac)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%239aa7b6' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{padding:0 14px}
.stack>*+*{margin-top:10px}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(18,21,26,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{font-size:19px;letter-spacing:-.2px}
.hsub{font-size:12.5px;color:var(--tx2);margin-top:1px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:17px;flex:0 0 auto}

/* cards */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card+.card{margin-top:10px}
.sect{margin:20px 0 9px;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3)}

/* progress */
.bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.stat b{display:block;font-size:19px;font-weight:680;letter-spacing:-.4px;line-height:1.2}
.stat span{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}

/* meal */
.meal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal+.meal{margin-top:9px}
.meal.done{border-color:#2c5d45}
.meal.done .mhead{background:linear-gradient(90deg,rgba(78,201,138,.11),transparent)}
.meal.skip{opacity:.5}
.mhead{display:flex;gap:11px;padding:12px 13px;align-items:flex-start}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:14px;color:transparent;margin-top:1px}
.meal.done .tick{background:var(--ok);border-color:var(--ok);color:#0d2418}
.meal.skip .tick{border-color:var(--bad);color:var(--bad)}
.mtime{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ac);font-weight:640;letter-spacing:.3px}
.mtitle{font-weight:600;font-size:15px;margin-top:1px}
.mkcal{margin-left:auto;text-align:right;flex:0 0 auto}
.mkcal b{font-size:15px;font-variant-numeric:tabular-nums}
.mbody{padding:0 13px 12px 50px}
.ing{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0;color:var(--tx2)}
.ing b{color:var(--tx);font-weight:500}
.ing i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--tx3);flex:0 0 auto}
.note{font-size:12.5px;color:var(--warn);background:rgba(242,178,60,.09);border-radius:9px;padding:7px 9px;margin-top:8px}
.tag{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--bg3);color:var(--tx2);vertical-align:middle}
.tag.frz{background:rgba(94,179,246,.16);color:var(--ac)}
.tag.opt{background:rgba(176,140,245,.16);color:var(--pur)}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:6px 11px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--tx2)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06121d;font-weight:600}
.chip.danger.on{background:var(--bad);border-color:var(--bad);color:#2a0d0a}

/* buttons */
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06121d}
.btn.sm{padding:9px;font-size:13.5px}
.btn.gh{background:none}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(18,21,26,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--tx3);font-size:10.5px;font-weight:600}
nav button.on{color:var(--ac)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* cycle grid */
.grid14{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{aspect-ratio:1;border-radius:11px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.dcell.today{border-color:var(--ac);background:rgba(94,179,246,.13)}
.dcell.free{background:rgba(176,140,245,.10)}
.dcell.longrun{background:rgba(78,201,138,.10)}
.dcell b{font-size:15px;font-variant-numeric:tabular-nums;line-height:1}
.dcell span{font-size:9.5px;color:var(--tx3)}
.dcell u{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:99px;background:var(--warn);text-decoration:none}

/* list rows */
.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow.checked .lname{text-decoration:line-through;color:var(--tx3)}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:transparent}
.lrow.checked .box{background:var(--ok);border-color:var(--ok);color:#0d2418}
.lname{flex:1;font-size:14px}
.lqty{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
.lgap{font-size:11px;font-weight:650}
.lgap.over{color:var(--warn)}.lgap.under{color:var(--bad)}

/* modal */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetbox{width:100%;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
label.f{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--tx2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
.hide{display:none!important}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px}
.spark>div{flex:1;border-radius:4px 4px 2px 2px;background:var(--bg3);position:relative;min-height:3px}
.spark>div.hi{background:var(--ac)}
</style>
</head>
<body>

<header>
  <div class="between">
    <div>
      <h1 id="hTitle">Сьогодні</h1>
      <div class="hsub" id="hSub"></div>
    </div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Налаштування">⚙</button>
  </div>
</header>

<main id="view" class="wrap"></main>

<nav>
  <button data-t="today" onclick="go('today')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Сьогодні</button>
  <button data-t="cycle" onclick="go('cycle')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Цикл</button>
  <button data-t="shop"  onclick="go('shop')"><svg viewBox="0 0 24 24"><path d="M6 6h15l-2 9H8L6 6zM6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>Покупки</button>
  <button data-t="kitchen" onclick="go('kitchen')"><svg viewBox="0 0 24 24"><path d="M4 3v8a3 3 0 003 3v7M7 3v6M10 3v6M17 3c-1.5 2-2 4-2 6s.5 3 2 3v9"/></svg>Кухня</button>
  <button data-t="stats" onclick="go('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Аналітика</button>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheetbox"><div class="grab"></div><div id="sheetContent"></div></div>
</div>

<script src="data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   СТАН
   ══════════════════════════════════════════════════════════════════ */
const KEY='meals.v1';
const D=window.SEED, P=D.products;

const blank=()=>({
  settings:{
    cycleStart: mondayOf(new Date()),
    kcalTarget: D.defaults.kcalTarget,
    proteinTarget: D.defaults.proteinTarget,
    prices:{}
  },
  log:{}, shop:{}, prep:{}, stock:[], weight:{}
});
let S = load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return blank();
    const s=JSON.parse(raw); const b=blank();
    return {...b,...s, settings:{...b.settings,...(s.settings||{})}};
  }catch(e){ console.warn('стан пошкоджено, починаю з чистого',e); return blank(); }
}
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(S)),120); }

/* ══════════════════════════════════════════════════════════════════
   ДАТИ ТА ЦИКЛ
   ══════════════════════════════════════════════════════════════════ */
const DOW=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function mondayOf(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return iso(x); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function human(s){ const d=parse(s); return d.getDate()+' '+MON[d.getMonth()]; }

/** Номер дня циклу (1..14) для конкретної дати */
function cycleDay(dateISO){
  const diff=daysBetween(S.settings.cycleStart,dateISO);
  return ((diff%14)+14)%14 + 1;
}
function dayPlan(dateISO){ const n=cycleDay(dateISO); return D.days.find(d=>d.n===n); }
function cycleIndex(dateISO){ return Math.floor(daysBetween(S.settings.cycleStart,dateISO)/14); }

let TODAY=iso(new Date());
let viewDate=TODAY;

/* ══════════════════════════════════════════════════════════════════
   РОЗРАХУНКИ
   ══════════════════════════════════════════════════════════════════ */
function isUnit(p){ return p.unit==='шт'||p.unit==='порція'; }
function price(id){ return S.settings.prices[id] ?? P[id].price; }

function itemCalc(it){
  const p=P[it.p]; if(!p) return {kcal:0,protein:0,cost:0};
  const per = isUnit(p)?1:100;
  // ціна вказана за одиницю ПРИ КУПІВЛІ (курка — за кг сирої),
  // тому для готової ваги множимо на коефіцієнт уварювання
  const unitPrice = price(it.p) * (p.rawRatio||1);
  return {
    kcal:    p.kcal    * it.q/per,
    protein: p.protein * it.q/per,
    cost:    unitPrice * it.q / (isUnit(p)?1:1000)
  };
}
function preset(id){ return D.canteen.presets.find(x=>x.id===id)||D.canteen.presets[0]; }

/** Розрахунок прийому їжі з урахуванням збережених правок за день */
function mealCalc(meal, rec){
  if(meal.canteen){
    const pr=preset(rec?.preset||meal.preset||D.canteen.defaultPreset);
    return { kcal: rec?.kcal ?? pr.kcal, protein: rec?.protein ?? pr.protein, cost: rec?.price ?? 0 };
  }
  let k=0,p=0,c=0;
  for(const it of (meal.items||[])){ const r=itemCalc(it); k+=r.kcal; p+=r.protein; c+=r.cost; }
  if(rec?.factor){ k*=rec.factor; p*=rec.factor; c*=rec.factor; }
  return {kcal:k,protein:p,cost:c};
}
function rec(dateISO,mealId){ return S.log[dateISO]?.meals?.[mealId]; }
function ensure(dateISO){
  if(!S.log[dateISO]) S.log[dateISO]={meals:{},extra:[],snack:null};
  const L=S.log[dateISO];
  if(!L.meals) L.meals={}; if(!L.extra) L.extra=[];
  return L;
}

/** Підсумок дня. mode:'plan' = за планом, 'fact' = врахувати статуси */
function dayTotals(dateISO, mode='fact'){
  const plan=dayPlan(dateISO), L=S.log[dateISO];
  let kcal=0,protein=0,cost=0,eaten=0,total=0;
  for(const m of plan.meals){
    const r=L?.meals?.[m.id];
    const st=r?.status;
    if(!m.optional) total++;
    if(mode==='fact'){
      if(st==='skipped') continue;
      if(!st && m.optional) continue;      // опційні не рахуємо, поки не відмічені
      if(st==='eaten') eaten++;
    } else {
      if(m.optional) continue;
    }
    const c=mealCalc(m,r); kcal+=c.kcal; protein+=c.protein; cost+=c.cost;
  }
  if(mode==='fact'&&L){
    for(const e of (L.extra||[])){ kcal+=e.kcal||0; protein+=e.protein||0; cost+=e.cost||0; }
    if(L.snack){ const s=D.snacks.find(x=>x.id===L.snack);
      if(s) for(const it of s.items){ const r=itemCalc(it); kcal+=r.kcal; protein+=r.protein; cost+=r.cost; } }
  }
  return {kcal:Math.round(kcal),protein:Math.round(protein),cost:Math.round(cost),eaten,total};
}

function fmtQty(it){
  const p=P[it.p];
  if(isUnit(p)) return it.q+' '+(p.unit==='шт'?'шт':'порц.');
  const range = (it.min&&it.max&&it.min!==it.max) ? it.min+'–'+it.max : it.q;
  return range+' '+p.unit+(p.dry?' сух.':'');
}

/* ══════════════════════════════════════════════════════════════════
   НАВІГАЦІЯ
   ══════════════════════════════════════════════════════════════════ */
let tab='today';
function go(t){ tab=t; viewDate = (t==='today')?TODAY:viewDate; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const V=document.getElementById('view');
  ({today:vToday,cycle:vCycle,shop:vShop,kitchen:vKitchen,stats:vStats}[tab])(V);
}
function setHead(t,s){ document.getElementById('hTitle').textContent=t; document.getElementById('hSub').innerHTML=s||''; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: СЬОГОДНІ
   ══════════════════════════════════════════════════════════════════ */
const TYPE={weekday:'будній день',free:'вільна їжа',longrun:'довгий біг'};

function vToday(V){
  const d=parse(viewDate), plan=dayPlan(viewDate), t=dayTotals(viewDate);
  const isToday = viewDate===TODAY;
  setHead(isToday?'Сьогодні':DOW[d.getDay()]+', '+human(viewDate),
    'День '+plan.n+' з 14 · тиждень '+plan.week+' · '+TYPE[plan.type]);

  const kp=Math.min(100,t.kcal/S.settings.kcalTarget*100);
  const pp=Math.min(100,t.protein/S.settings.proteinTarget*100);
  const kcol = t.kcal>S.settings.kcalTarget*1.15?'var(--warn)':'var(--ac)';

  let h='';

  // навігація по днях
  h+=`<div class="between" style="margin:12px 0">
    <button class="chip" onclick="shiftDay(-1)">‹ учора</button>
    ${isToday?'<span class="pill">сьогодні</span>':'<button class="chip" onclick="jumpToday()">до сьогодні</button>'}
    <button class="chip" onclick="shiftDay(1)">завтра ›</button>
  </div>`;

  // підсумки
  h+=`<div class="stats">
    <div class="stat"><b style="color:${kcol}">${t.kcal}</b><span>ккал</span></div>
    <div class="stat"><b>${t.protein}<small style="font-size:12px;color:var(--tx3)"> г</small></b><span>білок</span></div>
    <div class="stat"><b>${t.cost}<small style="font-size:12px;color:var(--tx3)"> ₴</small></b><span>витрати</span></div>
  </div>
  <div class="card" style="margin-top:9px">
    <div class="between small muted"><span>Калорії</span><span>${t.kcal} / ${S.settings.kcalTarget}</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${kp}%;background:${kcol}"></i></div>
    <div class="between small muted" style="margin-top:10px"><span>Білок</span><span>${t.protein} / ${S.settings.proteinTarget} г</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${pp}%;background:var(--ok)"></i></div>
  </div>`;

  // прийоми їжі
  h+='<div class="sect">План дня</div>';
  for(const m of plan.meals) h+=mealCard(m,viewDate);

  // снек
  const L=S.log[viewDate];
  const sn=L?.snack?D.snacks.find(x=>x.id===L.snack):null;
  const snk=sn?Math.round(sn.items.reduce((a,i)=>a+itemCalc(i).kcal,0)):0;
  h+='<div class="sect">Снек під фільм</div>';
  h+=`<div class="card"><div class="between">
    <div><div style="font-weight:600">${sn?esc(sn.name):'Не обрано'}</div>
      <div class="small muted">${sn?('+'+snk+' ккал до дня'):'2–3 рази на тиждень, один варіант'}</div></div>
    <button class="chip ${sn?'on':''}" onclick="pickSnack()">${sn?'змінити':'обрати'}</button>
  </div>${limitsHtml()}</div>`;

  // поза планом
  h+='<div class="sect">Поза планом</div>';
  const ex=L?.extra||[];
  if(ex.length){
    h+='<div class="card" style="padding:0">';
    ex.forEach((e,i)=>{ h+=`<div class="lrow"><div class="lname">${esc(e.name)}
      <div class="tiny dim">${Math.round(e.kcal)} ккал${e.protein?' · '+Math.round(e.protein)+' г білка':''}${e.cost?' · '+Math.round(e.cost)+' ₴':''}</div></div>
      <button class="chip" onclick="delExtra(${i})">✕</button></div>`; });
    h+='</div>';
  }
  h+=`<button class="btn ${ex.length?'':'pri'}" style="margin-top:9px" onclick="addExtra()">+ Додати їжу або напій</button>`;

  if(plan.type==='longrun') h+=`<div class="card" style="margin-top:14px;border-color:#2c5d45">

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: ПОКУПКИ
   ══════════════════════════════════════════════════════════════════ */
/* Продукти, які купуються з запасом на весь цикл (не псуються) */
const SHELF=['крупи','бакалія','снеки','риба','заморожене','напої','горіхи'];
/* Продукти під недільне готування — беруться на весь тиждень наперед */
const PREPCAT=["м'ясо",'яйця'];
const BUFFER=1.15;  // невеликий запас понад розрахунок

/** Скільки продукту реально треба за меню на вказані дні циклу */
function needFor(days, filter){
  const need={};
  for(const n of days){
    const pl=D.days.find(d=>d.n===n); if(!pl) continue;
    for(const m of pl.meals){
      if(m.optional) continue;
      for(const it of (m.items||[])){
        const p=P[it.p];
        if(p.noBuy || p.onDemand) continue;     // кава; шаурма/піца — купуються на місці
        if(!filter(p)) continue;
        let q=it.q;
        if(p.rawRatio) q*=p.rawRatio;           // готова курка → сира вага при купівлі
        need[it.p]=(need[it.p]||0)+q;
      }
    }
  }
  return need;
}
/** Розрахунок кошика однієї закупівлі.
 *  Вікна не перетинаються, тому один продукт не рахується двічі. */
/** Снеки під фільм: ~5 разів на цикл, розподілені між варіантами */
function snackNeed(){
  const n={};
  for(const s of D.snacks) for(const it of s.items){
    if(P[it.p]?.noBuy||P[it.p]?.onDemand) continue;
    n[it.p]=(n[it.p]||0)+it.q*0.7;
  }
  return n;
}
function shopComputed(sh){
  const perishable = needFor(sh.coversDays, p=>!SHELF.includes(p.cat) && !PREPCAT.includes(p.cat));
  const prep  = sh.prepDays ? needFor(sh.prepDays, p=>PREPCAT.includes(p.cat)) : {};
  const shelf = sh.stock ? needFor(D.days.map(d=>d.n), p=>SHELF.includes(p.cat)) : {};
  const all={...perishable,...prep,...shelf};
  if(sh.stock){  // снеки закуповуються разом із сухим запасом
    const sn=snackNeed();
    for(const k in sn) all[k]=(all[k]||0)+sn[k];
  }
  for(const k in all) all[k]=Math.round(all[k]*BUFFER);
  return all;
}
function shopKey(sh,ci){ return ci+'|'+sh.id; }

/** Скільки продукту потрібно за ВЕСЬ цикл — щоб не плутати
 *  «не потрібен взагалі» з «купується в іншу закупівлю». */
let _cycleNeed=null;
function cycleNeed(){
  if(_cycleNeed) return _cycleNeed;
  _cycleNeed=needFor(D.days.map(d=>d.n), ()=>true);
  const sn=snackNeed();
  for(const k in sn) _cycleNeed[k]=(_cycleNeed[k]||0)+sn[k];
  return _cycleNeed;
}
/** Пояснення до рядка списку покупок */
function shopBadge(id,base,comp){
  const b=base||0, c=comp||0, tot=cycleNeed()[id]||0;
  if(!b && c)                 return ['under','потрібно за меню, у плані немає'];
  if(b && !c && !tot)         return ['over','у меню не використовується'];
  if(b && !c &&  tot)         return ['',     'на цю закупівлю не потрібен — береться в іншу'];
  if(b && c && b/c>=3 && SHELF.includes(P[id].cat))
                              return ['over','пачка приблизно на '+plural(Math.round(b/c),'цикл','цикли','циклів')];
  if(b && c && b/c>1.5)       return ['over','у плані '+fmtBuy(id,b)+' — це +'+Math.round((b/c-1)*100)+'%'];
  if(b && c && c/b>1.2)       return ['under','у плані лише '+fmtBuy(id,b)+' — замало'];
  return ['',''];
}

    if(openShops[key]){

        const b=base[id]||0, c=Math.round(comp[id]||0), q=qtyOf(id);
        const [cls,txt]=shopBadge(id,b,c);
        const badge = txt ? `<span class="lgap ${cls}">${txt}</span>` : '';
        h+=`<div class="lrow ${st.checked?.[id]?'checked':''}">
          <div class="box" onclick="checkShop('${key}','${id}')">✓</div>

  // бюджет

  for(const c of D.budget.categories) h+=`<tr><td>${esc(c.name)}</td><td class="muted">${c.min}–${c.max}</td></tr>`;

let openShops={};
function toggleShop(k){ openShops[k]=!openShops[k]; render(); }
function checkShop(k,id){ const s=S.shop[k]=S.shop[k]||{checked:{},actual:{}}; s.checked=s.checked||{}; s.checked[id]=!s.checked[id]; save(); render(); }
function resetShop(k){ if(S.shop[k]) S.shop[k].checked={}; save(); render(); }
function setSpend(k,v){ const s=S.shop[k]=S.shop[k]||{checked:{},actual:{}}; s.actual={total:+v||0}; s.date=TODAY; save(); render(); }
function monthSpend(){
  const m=TODAY.slice(0,7); let n=0;
  // фактичні чеки із закупівель
  for(const k in S.shop){ const s=S.shop[k]; if(s.date?.startsWith(m)) n+=(+s.actual?.total||0); }
  for(const d in S.log){
    if(!d.startsWith(m)) continue;
    const L=S.log[d], pl=dayPlan(d);
    // столова — вписана ціна
    for(const id in (L.meals||{})) n+=(+L.meals[id].price||0);
    // їжа поза планом
    for(const e of (L.extra||[])) n+=(+e.cost||0);
    // шаурма / піца / Cola — купуються на місці, не входять у закупівлі
    for(const meal of pl.meals){
      if(L.meals?.[meal.id]?.status!=='eaten') continue;
      for(const it of (meal.items||[])) if(P[it.p]?.onDemand) n+=itemCalc(it).cost;
    }
  }
  return Math.round(n);
}
/** Оцінка місячних витрат за меню (без столової) */
function monthEstimate(){
  let cycle=0;
  for(const sh of D.shopping){ const c=shopComputed(sh); for(const id in c) cycle+=estCost(id,c[id]); }
  for(const pl of D.days) for(const m of pl.meals) for(const it of (m.items||[]))
    if(P[it.p]?.onDemand) cycle+=itemCalc(it).cost;
  return Math.round(cycle*30.44/14);
}
function plural(n,one,few,many){
  const a=Math.abs(n)%100, b=a%10;
  return n+' '+(a>10&&a<20?many : b>1&&b<5?few : b===1?one : many);
}
function fmtBuy(id,q){
  const p=P[id];
  if(isUnit(p)) return Math.ceil(q)+' '+(p.unit==='шт'?'шт':'порц.');
  if(q>=1000) return (q/1000).toFixed(q%1000?1:0).replace('.',',')+(p.unit==='мл'?' л':' кг');
  return Math.round(q)+' '+p.unit;
}
function estCost(id,q){ const p=P[id]; return price(id) * (isUnit(p)? q : q/1000); }

          <div style="min-width:0">
            <div style="font-weight:600">${esc(st.title)}</div>
            <div class="tiny dim">${st.minutes?st.minutes+' хв · ':''}<span style="color:${STOR[st.storage][1]}">${STOR[st.storage][0]}</span></div>
          </div>
        </div>
        <span class="dim">${openPrep[st.id]?'▾':'▸'}</span>
      </div>`;
    if(openPrep[st.id]){
      h+=`<hr><div class="small"><b class="muted">Потрібно:</b> ${esc(st.ingredients)}</div><div style="margin-top:8px">`;
      st.body.forEach((b,i)=>h+=`<div class="small" style="display:flex;gap:9px;margin-top:6px"><span class="dim">${i+1}</span><span>${esc(b)}</span></div>`);

  }
  V.innerHTML=h;
}
let openPrep={};
function togglePrepOpen(id){ openPrep[id]=!openPrep[id]; render(); }
function togglePrep(id){
  const p=S.prep[TODAY]=S.prep[TODAY]||{done:{}};

}
function stockMinus(id){
  const c=S.stock.find(x=>x.id===id); if(!c) return;
  c.portions--; if(c.portions<=0) S.stock=S.stock.filter(x=>x.id!==id);
  save(); render();
}
function stockDel(id){ S.stock=S.stock.filter(x=>x.id!==id); save(); render(); }

let timerH;
function startTimer(min,title){
  clearTimeout(timerH);
  const end=Date.now()+min*60000;
  alert('Таймер на '+min+' хв: '+title+'\n\nЗастосунок повідомить, поки він відкритий.');
  timerH=setTimeout(()=>{ notify('Готово: '+title, min+' хв минуло'); }, min*60000);
}
function notify(t,b){
  if('Notification' in window && Notification.permission==='granted') new Notification(t,{body:b,icon:'icons/icon-192.png'});
  else alert(t+'\n'+b);
}

function vStats(V){
  setHead('Аналітика','Дивись на середнє за 7 днів, не на один день');
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(TODAY,-i));
  const rows=days.map(d=>({d,t:dayTotals(d),plan:dayTotals(d,'plan'),logged:!!S.log[d]}));
  const logged=rows.filter(r=>r.logged);
  const avgK=logged.length?Math.round(logged.reduce((a,r)=>a+r.t.kcal,0)/logged.length):0;
  const avgP=logged.length?Math.round(logged.reduce((a,r)=>a+r.t.protein,0)/logged.length):0;
  const adh=(()=>{ let e=0,t=0; for(const r of rows){ e+=r.t.eaten; t+=r.t.total; } return t?Math.round(e/t*100):0; })();
  const max=Math.max(...rows.map(r=>r.plan.kcal),1);

  let h=`<div class="stats" style="margin-top:12px">
    <div class="stat"><b>${avgK||'—'}</b><span>ккал / день</span></div>
    <div class="stat"><b>${avgP||'—'}<small style="font-size:12px;color:var(--tx3)"> г</small></b><span>білок</span></div>
    <div class="stat"><b>${adh}<small style="font-size:12px;color:var(--tx3)">%</small></b><span>дотримання</span></div>
  </div>`;

  h+='<div class="sect">Останні 7 днів</div><div class="card">';
  h+='<div class="spark">';
  for(const r of rows){
    const v=r.logged?r.t.kcal:r.plan.kcal;
    h+=`<div class="${r.logged?'hi':''}" style="height:${Math.max(4,v/max*100)}%" title="${v}"></div>`;
  }
  h+='</div><div class="row" style="margin-top:6px">';
  for(const r of rows) h+=`<div style="flex:1;text-align:center" class="tiny dim">${DOW[parse(r.d).getDay()]}</div>`;
  h+='</div><div class="tiny dim" style="margin-top:8px">Синім — дні, які ти відмічав. Сірим — план.</div></div>';

  h+='<div class="card" style="margin-top:10px"><table>';
  for(const r of rows){
    const pl=dayPlan(r.d);
    h+=`<tr><td>${DOW[parse(r.d).getDay()]}, ${human(r.d)} <span class="dim tiny">д.${pl.n}</span></td>
      <td>${r.logged?`<b>${r.t.kcal}</b>`:`<span class="dim">${r.plan.kcal}</span>`} <span class="dim tiny">ккал</span></td></tr>`;
  }
  h+='</table></div>';

  // вага
  h+='<div class="sect">Вага</div>';
  const ws=Object.keys(S.weight).sort();
  const last=ws.length?S.weight[ws[ws.length-1]]:null;
  const prev=ws.length>1?S.weight[ws[ws.length-2]]:null;
  h+=`<div class="card"><div class="between">
    <div><b style="font-size:22px">${last?last+' кг':'—'}</b>
      ${prev?`<span class="small ${last<prev?'':'muted'}" style="margin-left:8px;color:${last<prev?'var(--ok)':'var(--tx2)'}">${last>prev?'+':''}${(last-prev).toFixed(1)}</span>`:''}
      <div class="tiny dim">${ws.length?'останній запис '+human(ws[ws.length-1]):'ще немає записів'}</div></div>
    <button class="chip on" onclick="addWeight()">Записати</button></div></div>`;

  h+=`<div class="card" style="margin-top:14px"><div class="small muted">${esc(D.defaults.principle)}</div></div>`;
  h+=`<div class="card" style="margin-top:10px"><div class="small muted"><b style="color:var(--warn)">Найбільша похибка — столова.</b> Реальний повний обід може бути і 550, і 900+ ккал. Перші кілька разів варто просто подивитись очима на порції й підібрати пресет.</div></div>`;
  V.innerHTML=h;
}

/** Заміна страви: взаємозамінні бази з перерахунком ккал */
const SWAPS={buckwheat:['rice','pasta'],rice:['buckwheat','pasta'],pasta:['buckwheat','rice'],
  chicken:['egg','fish_can'],fish_can:['chicken','egg'],egg:['chicken','fish_can'],
  yogurt:['cottage','kefir'],cottage:['yogurt','kefir'],kefir:['yogurt','cottage']};
function swapMeal(date,mid){
  const meal=dayPlan(date).meals.find(m=>m.id===mid);
  const base=(meal.items||[]).find(i=>SWAPS[i.p]);
  if(!base){ alert('Для цієї страви немає готових замін. Скористайся кнопкою «Порція» або додай запис поза планом.'); return; }
  const src=P[base.p], srcK=itemCalc(base).kcal;
  let h=`<h2 style="font-size:17px;margin-bottom:6px">Заміна: ${esc(src.name)}</h2>
    <div class="small muted" style="margin-bottom:12px">Кількість перерахована так, щоб калорійність збіглася (${Math.round(srcK)} ккал).</div><div class="card" style="padding:0">`;
  for(const alt of SWAPS[base.p]){
    const a=P[alt];
    const per=isUnit(a)?a.kcal:a.kcal/100;
    const q = isUnit(a) ? Math.round(srcK/per*10)/10 : Math.round(srcK/per*100);
    h+=`<div class="lrow" onclick="doSwap('${date}','${mid}','${base.p}','${alt}',${q})">
      <div class="lname">${esc(a.name)}<div class="tiny dim">замість ${base.q} ${src.unit}${src.dry?' сух.':''} ${esc(src.name).toLowerCase()}</div></div>
      <div class="lqty">${q} ${a.unit}${a.dry?' сух.':''}</div></div>`;
  }
  h+='</div><button class="btn gh sm" style="margin-top:12px" onclick="closeSheet()">Скасувати</button>';
  sheet(h);
}
function doSwap(date,mid,from,to,q){
  const L=ensure(date); const c=L.meals[mid]=L.meals[mid]||{};
  c.swaps=c.swaps||{}; c.swaps[from]={to,q};
  L.extra.push({name:'Заміна: '+P[to].name+' замість '+P[from].name, kcal:0, protein:0, cost:0, meta:true});
  save(); closeSheet(); render();
}
function portionMeal(date,mid){
  const r=rec(date,mid)||{};
  const cur=r.factor??1;
  let h='<h2 style="font-size:17px;margin-bottom:12px">Розмір порції</h2><div class="card" style="padding:0">';
  for(const f of [0.5,0.75,1,1.25,1.5]){
    h+=`<div class="lrow ${cur===f?'checked':''}" onclick="setFactor('${date}','${mid}',${f})">
      <div class="box">✓</div><div class="lname">${f===1?'Звичайна порція':(f<1?'':'+')+Math.round((f-1)*100)+'%'}</div>
      <div class="lqty">×${f}</div></div>`;
  }
  sheet(h+'</div>');
}

function dl(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);

  r.readAsText(f);
}

function icsDate(dateISO,time){ return dateISO.replace(/-/g,'')+'T'+time.replace(':','')+'00'; }
function exportICS(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meals//UA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Харчування'];
  const base=S.settings.cycleStart;
  let uid=0;
  const ev=(date,time,title,desc,alarmMin)=>{
    L.push('BEGIN:VEVENT',
      'UID:meals-'+(++uid)+'-'+date+'@local',
      'DTSTAMP:'+icsDate(TODAY,'12:00')+'Z',
      'DTSTART;TZID=Europe/Kiev:'+icsDate(date,time),
      'DURATION:PT30M',
      'RRULE:FREQ=DAILY;INTERVAL=14',
      'SUMMARY:'+title.replace(/[,;]/g,' '),
      'DESCRIPTION:'+(desc||'').replace(/[,;]/g,' ').replace(/\n/g,'\\n'));
    if(alarmMin!==null) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title.replace(/[,;]/g,' '),'TRIGGER:-PT'+alarmMin+'M','END:VALARM');
    L.push('END:VEVENT');
  };
  D.days.forEach((pl,i)=>{
    const date=addDays(base,i);
    for(const m of pl.meals){
      if(m.optional) continue;
      const c=mealCalc(m);
      const items=m.canteen?preset(m.preset).name:(m.items||[]).map(it=>P[it.p].name+' '+fmtQty(it)).join(', ');
      ev(date,m.time,m.title,items+'\n≈'+Math.round(c.kcal)+' ккал',10);
      if(m.freezer) ev(addDays(date,-1),'21:00','Дістати з морозилки: '+m.title,'Завтра о '+m.time,0);
    }
    if(pl.type==='longrun') ev(date,'09:00','Недільне готування впрок','60–90 хвилин. Курка, гречка, рис, макарони, розкладка по контейнерах.',30);
  });
  for(const sh of D.shopping){
    const off = sh.day===0 ? -1 : sh.day-1;
    ev(addDays(base,off),'11:00','🛒 '+sh.name,sh.hint,60);
  }
  L.push('END:VCALENDAR');
  dl('meals-calendar.ics',L.join('\r\n'),'text/calendar;charset=utf-8');
  setTimeout(()=>alert('Файл завантажено.\n\nВідкрий Google Calendar → Налаштування → Імпорт та експорт → Імпорт, і обери цей файл. Події повторюватимуться кожні 14 днів.'),400);
}

/* ══════════════════════════════════════════════════════════════════
   СТАРТ
   ══════════════════════════════════════════════════════════════════ */
setInterval(()=>{ const n=iso(new Date()); if(n!==TODAY){ if(viewDate===TODAY) viewDate=n; TODAY=n; render(); } },60000);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
