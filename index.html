<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#12151a">
<title>Харчування</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#12151a; --bg2:#1a1f27; --bg3:#232a34; --line:#2e3742;
  --tx:#e8edf3; --tx2:#9aa7b6; --tx3:#6b7887;
  --ac:#5eb3f6; --ok:#4ec98a; --warn:#f2b23c; --bad:#f2685c; --pur:#b08cf5;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ac)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%239aa7b6' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{padding:0 14px}

header{position:sticky;top:0;z-index:30;background:rgba(18,21,26,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{font-size:19px;letter-spacing:-.2px}
.hsub{font-size:12.5px;color:var(--tx2);margin-top:1px}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:17px;flex:0 0 auto}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card+.card{margin-top:10px}
.sect{margin:20px 0 9px;font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3)}
.bar{height:7px;border-radius:99px;background:var(--bg3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .35s}

.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14.5px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#06121d}
.btn.sm{padding:9px;font-size:13.5px}
.btn.gh{background:none}
.chip{font-size:12.5px;padding:6px 11px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--tx2)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06121d;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--tx2)}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(18,21,26,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--tx3);font-size:10.5px;font-weight:600}
nav button.on{color:var(--ac)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.lrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lname{flex:1;font-size:14px;min-width:0}
.lqty{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}

.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetbox{width:100%;max-height:90vh;overflow:auto;background:var(--bg2);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
label.f{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
.hide{display:none!important}

/* оцінка корисності */
.hdot{display:inline-block;width:9px;height:9px;border-radius:99px;vertical-align:baseline;margin-right:2px}
.h5{background:#4ec98a}.h4{background:#8fd06a}.h3{background:#c9c95e}.h2{background:#f2b23c}.h1{background:#f2685c}

/* кільце калорій */
.ringwrap{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-size:22px;letter-spacing:-.5px;line-height:1.1}
.ring .mid span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.macro{margin-top:8px}
.macro .between{font-size:12.5px}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px}
.spark>div{flex:1;border-radius:4px 4px 2px 2px;background:var(--bg3);position:relative;min-height:3px}
.spark>div.hi{background:var(--ac)}
.spark>div.over{background:var(--warn)}
.star{font-size:17px;color:var(--tx3);flex:0 0 auto;padding:4px}
.star.on{color:var(--warn)}
.entry-k{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header>
  <div class="between">
    <div>
      <h1 id="hTitle">Щоденник</h1>
      <div class="hsub" id="hSub"></div>
    </div>
    <button class="iconbtn" onclick="openSettings()" aria-label="Налаштування">⚙</button>
  </div>
</header>

<main id="view" class="wrap"></main>

<nav>
  <button data-t="diary" onclick="go('diary')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Щоденник</button>
  <button data-t="base" onclick="go('base')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>База</button>
  <button data-t="spend" onclick="go('spend')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Витрати</button>
  <button data-t="stats" onclick="go('stats')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Аналітика</button>
</nav>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheetbox"><div class="grab"></div><div id="sheetContent"></div></div>
</div>

<script src="data.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   СТАН
   ══════════════════════════════════════════════════════════════════ */
const KEY='meals.v2';
const D=window.SEED;

const blank=()=>({
  profile:{ sex:'m', age:35, height:180, weight:80, activity:1.3, mode:'mild' },
  fav:['chicken','buckwheat_c','greek','cottage5','banana','coffee','canteen_full','yogurt_bowl'],
  custom:{},           // власні продукти
  diary:{},            // date -> [записи]
  workout:{},          // date -> ккал тренування
  expense:{},          // date -> [{n,v}]
  weight:{}            // date -> кг
});
let S=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return blank();
    const s=JSON.parse(raw), b=blank();
    return {...b,...s, profile:{...b.profile,...(s.profile||{})}};
  }catch(e){ return blank(); }
}
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>localStorage.setItem(KEY,JSON.stringify(S)),120); }

/* Об'єднаний каталог: базовий + власні */
function P(id){ return S.custom[id]||D.products[id]; }
function allIds(){ return [...Object.keys(D.products),...Object.keys(S.custom)]; }

/* ══════════════════════════════════════════════════════════════════
   ДАТИ
   ══════════════════════════════════════════════════════════════════ */
const DOW=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const MON=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function human(s){ const d=parse(s); return d.getDate()+' '+MON[d.getMonth()]; }
let TODAY=iso(new Date());
let viewDate=TODAY;
let viewMonth=TODAY.slice(0,7);

/* ══════════════════════════════════════════════════════════════════
   НОРМА КАЛОРІЙ (Міффлін–Сан Жеор)
   ══════════════════════════════════════════════════════════════════ */
const MODES={
  balance:{name:'Баланс',          def:0,   hint:'підтримання ваги'},
  mild:   {name:'Помірний',        def:330, hint:'≈ −300 г/тиждень'},
  mid:    {name:'Середній',        def:550, hint:'≈ −500 г/тиждень'},
  fast:   {name:'Швидкий',         def:770, hint:'≈ −700 г/тиждень — обережно при бігових тренуваннях'}
};
function bmr(){
  const p=S.profile;
  return Math.round(10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161));
}
function maintain(){ return Math.round(bmr()*S.profile.activity); }
function kcalTarget(date){
  const w=+S.workout[date]||0;
  let t=maintain() - MODES[S.profile.mode].def + w;
  return Math.max(t, bmr());   // не опускаємось нижче базового обміну
}
function proteinTarget(){ return Math.round(1.7*S.profile.weight); }
function fatTarget(date){ return Math.round(kcalTarget(date)*0.275/9); }
function carbTarget(date){
  return Math.max(0, Math.round((kcalTarget(date) - proteinTarget()*4 - fatTarget(date)*9)/4));
}

/* ══════════════════════════════════════════════════════════════════
   РОЗРАХУНКИ ЩОДЕННИКА
   ══════════════════════════════════════════════════════════════════ */
function isUnit(p){ return p.unit==='шт'||p.unit==='порція'; }
function calc(pid,qty){
  const p=P(pid); if(!p) return {k:0,p:0,f:0,c:0};
  const per=isUnit(p)?1:100;
  return { k:p.kcal*qty/per, p:p.p*qty/per, f:p.f*qty/per, c:p.c*qty/per };
}
function entries(date){ return S.diary[date]||[]; }
function dayTotals(date){
  let k=0,pr=0,f=0,c=0,fvGrams=0,hSum=0;
  for(const e of entries(date)){
    k+=e.k; pr+=e.p; f+=e.f; c+=e.c;
    hSum+=e.k*(e.h||3);
    const prod=P(e.pid);
    if(prod && (prod.cat==='овочі'||prod.cat==='фрукти')){
      fvGrams += isUnit(prod) ? e.qty*(prod.cat==='фрукти'?130:150) : e.qty;
    }
  }
  return {k:Math.round(k),p:Math.round(pr),f:Math.round(f),c:Math.round(c),
          avgH:k?hSum/k:0, fv:Math.round(fvGrams)};
}
/** Індекс корисності дня 0–100 */
function healthIndex(date){
  const t=dayTotals(date);
  if(!t.k) return null;
  let score=(t.avgH-1)/4*80;                 // база 0..80 від зваженої оцінки
  const parts={base:Math.round(score),veg:0,prot:0};
  if(t.fv>=400){ score+=10; parts.veg=10; }
  if(t.p>=proteinTarget()*0.9){ score+=10; parts.prot=10; }
  return {score:Math.round(Math.min(100,score)),parts,t};
}

/* ══════════════════════════════════════════════════════════════════
   НАВІГАЦІЯ
   ══════════════════════════════════════════════════════════════════ */
let tab='diary';
function go(t){ tab=t; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const V=document.getElementById('view');
  ({diary:vDiary,base:vBase,spend:vSpend,stats:vStats}[tab])(V);
}
function setHead(t,s){ document.getElementById('hTitle').textContent=t; document.getElementById('hSub').innerHTML=s||''; }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=n=>Math.round(n*10)/10;
function hdot(h){ return `<span class="hdot h${h||3}"></span>`; }
function fmtQ(e){ const p=P(e.pid); return isUnit(p||{unit:'шт'})?e.qty+' '+((p?.unit==='порція')?'порц.':'шт'):Math.round(e.qty)+' '+(p?.unit||'г'); }

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: ЩОДЕННИК
   ══════════════════════════════════════════════════════════════════ */
function vDiary(V){
  const d=parse(viewDate), t=dayTotals(viewDate);
  const target=kcalTarget(viewDate), left=target-t.k;
  const hi=healthIndex(viewDate);
  const w=+S.workout[viewDate]||0;
  setHead(viewDate===TODAY?'Сьогодні':DOW[d.getDay()]+', '+human(viewDate),
    'Ціль '+target+' ккал'+(w?' (з тренуванням +'+w+')':''));

  const pT=proteinTarget(), fT=fatTarget(viewDate), cT=carbTarget(viewDate);
  const ringPct=Math.min(1,t.k/target);
  const ringCol = t.k>target ? 'var(--warn)' : 'var(--ac)';
  const R=52, CIRC=2*Math.PI*R;

  let h=`<div class="between" style="margin:12px 0">
    <button class="chip" onclick="shiftDay(-1)">‹ ${human(addDays(viewDate,-1))}</button>
    ${viewDate===TODAY?'<span class="pill">сьогодні</span>':'<button class="chip" onclick="viewDate=TODAY;render()">до сьогодні</button>'}
    <button class="chip" onclick="shiftDay(1)">${human(addDays(viewDate,1))} ›</button>
  </div>`;

  // кільце + БЖВ
  h+=`<div class="card"><div class="ringwrap">
    <div class="ring">
      <svg width="118" height="118">
        <circle cx="59" cy="59" r="${R}" fill="none" stroke="var(--bg3)" stroke-width="10"/>
        <circle cx="59" cy="59" r="${R}" fill="none" stroke="${ringCol}" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-ringPct)}"/>
      </svg>
      <div class="mid">
        <b style="color:${left<0?'var(--warn)':'var(--tx)'}">${left>=0?left:'+'+(-left)}</b>
        <span>${left>=0?'ще можна':'перебір'}</span>
        <span class="dim" style="font-size:10px;margin-top:2px">${t.k} / ${target}</span>
      </div>
    </div>
    <div style="flex:1;min-width:0">
      ${macroBar('Білки',t.p,pT,'var(--ok)')}
      ${macroBar('Жири',t.f,fT,'var(--warn)')}
      ${macroBar('Вуглеводи',t.c,cT,'var(--pur)')}
    </div>
  </div>
  <hr>
  <div class="between">
    <div class="small muted">Індекс корисності дня</div>
    ${hi?`<button class="chip ${hi.score>=70?'on':''}" onclick="explainIndex('${viewDate}')"
      style="${hi.score>=70?'':(hi.score>=45?'color:var(--warn);border-color:var(--warn)':'color:var(--bad);border-color:var(--bad)')}">
      ${hi.score} / 100</button>`:'<span class="dim small">поки порожньо</span>'}
  </div></div>`;

  // тренування
  h+=`<div class="card" style="margin-top:10px"><div class="between">
    <div><div class="small" style="font-weight:600">🏃 Тренування</div>
      <div class="tiny dim">${w?'+'+w+' ккал додано до денної цілі':'внеси витрачені ккал з фітнес-застосунку'}</div></div>
    <button class="chip ${w?'on':''}" onclick="askWorkout()">${w?w+' ккал':'додати'}</button>
  </div></div>`;

  // записи
  h+='<div class="sect">З’їдено</div>';
  const es=entries(viewDate);
  if(!es.length) h+='<div class="card"><div class="muted small">Ще нічого не записано. Натисни «+ Додати їжу» — пошук, обране і типові порції вже налаштовані.</div></div>';
  else{
    h+='<div class="card" style="padding:0">';
    es.forEach((e,i)=>{
      h+=`<div class="lrow" onclick="editEntry(${i})">
        <div class="lname">${hdot(e.h)}${esc(e.name)}
          <div class="tiny dim">${fmtQ(e)} · Б ${r1(e.p)} · Ж ${r1(e.f)} · В ${r1(e.c)}${e.time?' · '+e.time:''}</div></div>
        <div class="entry-k">${Math.round(e.k)}</div>
      </div>`;
    });
    h+='</div>';
  }
  h+='<button class="btn pri" style="margin-top:10px" onclick="openAdd()">+ Додати їжу</button>';
  V.innerHTML=h;
}
function macroBar(name,val,target,col){
  const pct=Math.min(100,val/target*100);
  const over=val>target*1.15;
  return `<div class="macro">
    <div class="between"><span class="muted">${name}</span>
      <span class="dim" style="font-variant-numeric:tabular-nums">${Math.round(val)} / ${target} г</span></div>
    <div class="bar" style="margin-top:4px"><i style="width:${pct}%;background:${over?'var(--bad)':col}"></i></div>
  </div>`;
}
function shiftDay(n){ viewDate=addDays(viewDate,n); render(); }

function explainIndex(date){
  const hi=healthIndex(date); if(!hi) return;
  sheet(`<h2 style="font-size:17px;margin-bottom:10px">Індекс корисності: ${hi.score}</h2>
    <table>
      <tr><td>Якість їжі (зважена оцінка продуктів)</td><td>${hi.parts.base} / 80</td></tr>
      <tr><td>Овочі та фрукти ≥ 400 г <span class="dim">(зараз ${hi.t.fv} г)</span></td><td>${hi.parts.veg} / 10</td></tr>
      <tr><td>Білок ≥ 90% цілі <span class="dim">(зараз ${hi.t.p} г із ${proteinTarget()})</span></td><td>${hi.parts.prot} / 10</td></tr>
    </table>
    <div class="tiny dim" style="margin-top:12px">Кожен продукт має оцінку 1–5 (кольорова крапка). Індекс — середнє цих оцінок, зважене за калоріями, плюс два бонуси. Одна шаурма не робить день «поганим»: 70+ — добре, 45–69 — нормально, нижче — день задоволень.</div>
    <button class="btn gh sm" style="margin-top:12px" onclick="closeSheet()">Зрозуміло</button>`);
}
function askWorkout(){
  const w=+S.workout[viewDate]||0;
  sheet(`<h2 style="font-size:17px;margin-bottom:12px">Тренування</h2>
    <label class="f">Витрачено ккал (з фітнес-застосунку)</label>
    <input id="wk" type="number" inputmode="numeric" value="${w||''}" placeholder="0">
    <div class="tiny dim" style="margin-top:8px">Додається до денної цілі: у день тренування можна з'їсти більше. У день довгої не намагайся «зекономити» це — воно вже витрачене.</div>
    <button class="btn pri" style="margin-top:12px" onclick="saveWorkout()">Зберегти</button>
    ${w?'<button class="btn gh sm" style="margin-top:8px;color:var(--bad)" onclick="delWorkout()">Прибрати</button>':''}`);
}
function saveWorkout(){ const v=+document.getElementById('wk').value||0; if(v>0) S.workout[viewDate]=v; else delete S.workout[viewDate]; save(); closeSheet(); render(); }
function delWorkout(){ delete S.workout[viewDate]; save(); closeSheet(); render(); }

/* ── додавання їжі ── */
let pickQ='';
function openAdd(){ pickQ=''; renderPick(); }
function renderPick(){
  const q=pickQ.trim().toLowerCase();
  const ids=allIds();
  const match=id=>P(id).name.toLowerCase().includes(q);
  const favs=S.fav.filter(id=>P(id)&&match(id));
  const recent=recentIds().filter(id=>match(id)&&!favs.includes(id)).slice(0,6);
  let rest=ids.filter(id=>match(id)&&!favs.includes(id)&&!recent.includes(id));
  rest.sort((a,b)=>P(a).cat===P(b).cat?P(a).name.localeCompare(P(b).name):(D.cats.indexOf(P(a).cat)-D.cats.indexOf(P(b).cat)));

  let h=`<h2 style="font-size:17px;margin-bottom:10px">Що ти їв?</h2>
    <input id="pickQ" placeholder="Пошук: гречка, шаурма, капучино…" value="${esc(pickQ)}"
      oninput="pickQ=this.value;renderPickList()" autocomplete="off">
    <div id="pickList" style="margin-top:10px">${pickListHtml(favs,recent,rest,q)}</div>
    <button class="btn sm" style="margin-top:12px" onclick="newProduct('fromPick')">+ Створити новий продукт</button>`;
  sheet(h);
  setTimeout(()=>{const el=document.getElementById('pickQ'); if(el&&!('ontouchstart' in window)) el.focus();},50);
}
function renderPickList(){
  const q=pickQ.trim().toLowerCase();
  const ids=allIds(); const match=id=>P(id).name.toLowerCase().includes(q);
  const favs=S.fav.filter(id=>P(id)&&match(id));
  const recent=recentIds().filter(id=>match(id)&&!favs.includes(id)).slice(0,6);
  let rest=ids.filter(id=>match(id)&&!favs.includes(id)&&!recent.includes(id));
  rest.sort((a,b)=>P(a).cat===P(b).cat?P(a).name.localeCompare(P(b).name):(D.cats.indexOf(P(a).cat)-D.cats.indexOf(P(b).cat)));
  document.getElementById('pickList').innerHTML=pickListHtml(favs,recent,rest,q);
}
function pickListHtml(favs,recent,rest,q){
  const row=id=>{
    const p=P(id), c=calc(id,p.portion);
    return `<div class="lrow" onclick="pickPortion('${id}')">
      <div class="lname">${hdot(p.h)}${esc(p.name)}
        <div class="tiny dim">${esc(p.cat)} · порція ${isUnit(p)?p.portion+' '+(p.unit==='порція'?'порц.':'шт'):p.portion+' '+p.unit} ≈ ${Math.round(c.k)} ккал</div></div>
      <div class="lqty dim">${isUnit(p)?p.kcal:p.kcal} <span class="tiny">ккал${isUnit(p)?'/шт':'/100'}</span></div>
    </div>`;
  };
  let h='';
  if(favs.length){ h+='<div class="sect" style="margin-top:6px">★ Обране</div><div class="card" style="padding:0">'+favs.map(row).join('')+'</div>'; }
  if(recent.length){ h+='<div class="sect">Нещодавні</div><div class="card" style="padding:0">'+recent.map(row).join('')+'</div>'; }
  if(rest.length){ h+='<div class="sect">'+(q?'Знайдено':'Усі продукти')+'</div><div class="card" style="padding:0">'+rest.slice(0,q?50:200).map(row).join('')+'</div>'; }
  if(!favs.length&&!recent.length&&!rest.length) h+='<div class="card" style="margin-top:10px"><div class="muted small">Нічого не знайдено. Створи новий продукт — кнопка нижче.</div></div>';
  return h;
}
function recentIds(){
  const seen=new Set(), out=[];
  for(let i=0;i<14;i++){
    for(const e of entries(addDays(TODAY,-i))) if(e.pid&&!seen.has(e.pid)){ seen.add(e.pid); out.push(e.pid); }
  }
  return out;
}

function pickPortion(id,editIdx){
  const p=P(id);
  const cur = editIdx!=null ? entries(viewDate)[editIdx].qty : p.portion;
  const unitLbl=isUnit(p)?(p.unit==='порція'?'порцій':'шт'):p.unit;
  sheet(`<h2 style="font-size:17px;margin-bottom:4px">${hdot(p.h)}${esc(p.name)}</h2>
    <div class="tiny dim" style="margin-bottom:12px">${esc(p.cat)} · ${isUnit(p)?p.kcal+' ккал за 1':p.kcal+' ккал / 100 '+p.unit}</div>
    <label class="f">Порція, ${unitLbl}</label>
    <input id="ptQ" type="number" inputmode="decimal" step="${isUnit(p)?0.5:10}" value="${cur}" oninput="ptPreview('${id}')">
    <div class="row" style="gap:7px;margin-top:9px;flex-wrap:wrap">
      ${[0.5,0.75,1,1.5,2].map(m=>`<button class="chip" onclick="ptMul('${id}',${m})">×${m}</button>`).join('')}
    </div>
    <div class="card" style="margin-top:12px"><div class="between">
      <span class="muted small">Вийде</span><b id="ptK" style="font-size:18px"></b></div>
      <div class="tiny dim" id="ptM" style="margin-top:4px"></div>
    </div>
    <button class="btn pri" style="margin-top:12px" onclick="${editIdx!=null?`saveEntryEdit(${editIdx},'${id}')`:`addEntry('${id}')`}">${editIdx!=null?'Зберегти':'Додати в щоденник'}</button>
    ${editIdx!=null?`<button class="btn gh sm" style="margin-top:8px;color:var(--bad)" onclick="delEntry(${editIdx})">Видалити запис</button>`:''}`);
  ptPreview(id);
}
function ptMul(id,m){ const p=P(id); const el=document.getElementById('ptQ'); el.value=isUnit(p)?r1(p.portion*m):Math.round(p.portion*m); ptPreview(id); }
function ptPreview(id){
  const q=+document.getElementById('ptQ').value||0, c=calc(id,q);
  document.getElementById('ptK').textContent=Math.round(c.k)+' ккал';
  document.getElementById('ptM').textContent='Білки '+r1(c.p)+' г · Жири '+r1(c.f)+' г · Вуглеводи '+r1(c.c)+' г';
}
function snapshot(id,q){
  const p=P(id), c=calc(id,q);
  return { pid:id, name:p.name, qty:q, k:c.k, p:c.p, f:c.f, c:c.c, h:p.h,
           time:new Date().toTimeString().slice(0,5) };
}
function addEntry(id){
  const q=+document.getElementById('ptQ').value||0; if(!q) return;
  (S.diary[viewDate]=S.diary[viewDate]||[]).push(snapshot(id,q));
  save(); closeSheet(); render();
}
function editEntry(i){
  const e=entries(viewDate)[i];
  if(e.pid&&P(e.pid)) pickPortion(e.pid,i);
  else sheet(`<h2 style="font-size:17px;margin-bottom:12px">${esc(e.name)}</h2>
    <div class="muted small">Продукт було видалено з бази — запис можна лише прибрати.</div>
    <button class="btn gh sm" style="margin-top:12px;color:var(--bad)" onclick="delEntry(${i})">Видалити запис</button>`);
}
function saveEntryEdit(i,id){
  const q=+document.getElementById('ptQ').value||0; if(!q) return;
  const old=entries(viewDate)[i];
  S.diary[viewDate][i]={...snapshot(id,q), time:old.time};
  save(); closeSheet(); render();
}
function delEntry(i){ S.diary[viewDate].splice(i,1); save(); closeSheet(); render(); }

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: БАЗА ПРОДУКТІВ
   ══════════════════════════════════════════════════════════════════ */
let baseQ='';
function vBase(V){
  setHead('База продуктів', allIds().length+' позицій · ★ — обране');
  const q=baseQ.trim().toLowerCase();
  const ids=allIds().filter(id=>P(id).name.toLowerCase().includes(q));
  ids.sort((a,b)=>P(a).cat===P(b).cat?P(a).name.localeCompare(P(b).name):(D.cats.indexOf(P(a).cat)-D.cats.indexOf(P(b).cat)));

  let h=`<div style="margin:12px 0"><input placeholder="Пошук по назві…" value="${esc(baseQ)}" oninput="baseQ=this.value;render()"></div>`;
  h+=`<button class="btn" onclick="newProduct()">+ Новий продукт</button>`;
  let lastCat='';
  for(const id of ids){
    const p=P(id), custom=!!S.custom[id];
    if(p.cat!==lastCat){ if(lastCat)h+='</div>'; h+=`<div class="sect">${esc(p.cat)}</div><div class="card" style="padding:0">`; lastCat=p.cat; }
    h+=`<div class="lrow">
      <button class="star ${S.fav.includes(id)?'on':''}" onclick="toggleFav('${id}')">★</button>
      <div class="lname" onclick="${custom?`newProduct(null,'${id}')`:`showProduct('${id}')`}">${hdot(p.h)}${esc(p.name)}${custom?' <span class="tiny" style="color:var(--ac)">моє</span>':''}
        <div class="tiny dim">${isUnit(p)?p.kcal+' ккал/'+(p.unit==='порція'?'порц.':'шт'):p.kcal+' ккал/100'+p.unit} · Б ${p.p} Ж ${p.f} В ${p.c}</div></div>
      <div class="lqty dim tiny">порція<br>${p.portion} ${isUnit(p)?(p.unit==='порція'?'порц.':'шт'):p.unit}</div>
    </div>`;
  }
  if(lastCat)h+='</div>';
  if(!ids.length) h+='<div class="card" style="margin-top:10px"><div class="muted small">Нічого не знайдено.</div></div>';
  V.innerHTML=h;
}
function toggleFav(id){
  const i=S.fav.indexOf(id);
  if(i>=0)S.fav.splice(i,1); else S.fav.push(id);
  save(); if(tab==='base')render();
}
function showProduct(id){
  const p=P(id);
  sheet(`<h2 style="font-size:17px;margin-bottom:4px">${hdot(p.h)}${esc(p.name)}</h2>
    <div class="tiny dim" style="margin-bottom:10px">${esc(p.cat)} · базовий продукт (значення усереднені; етикетка пріоритетніша)</div>
    <table>
      <tr><td>Калорії</td><td>${p.kcal} ${isUnit(p)?'за 1':'на 100 '+p.unit}</td></tr>
      <tr><td>Білки</td><td>${p.p} г</td></tr>
      <tr><td>Жири</td><td>${p.f} г</td></tr>
      <tr><td>Вуглеводи</td><td>${p.c} г</td></tr>
      <tr><td>Оцінка корисності</td><td>${p.h} / 5</td></tr>
      <tr><td>Типова порція</td><td>${p.portion} ${isUnit(p)?(p.unit==='порція'?'порц.':'шт'):p.unit}</td></tr>
    </table>
    <button class="btn sm" style="margin-top:12px" onclick="newProduct(null,null,'${id}')">Створити мою копію з іншими цифрами</button>
    <button class="btn gh sm" style="margin-top:8px" onclick="closeSheet()">Закрити</button>`);
}
function newProduct(ret,editId,copyId){
  const src = editId?S.custom[editId] : copyId?P(copyId) : null;
  const v=src||{name:'',unit:'г',kcal:'',p:'',f:'',c:'',h:3,portion:100,cat:'готові страви'};
  sheet(`<h2 style="font-size:17px;margin-bottom:12px">${editId?'Редагувати продукт':'Новий продукт'}</h2>
    <label class="f">Назва</label>
    <input id="npN" value="${esc(editId?v.name:(copyId?v.name+' (моє)':''))}" placeholder="Напр.: борщ мамин">
    <div class="f2" style="margin-top:10px">
      <div><label class="f">Одиниця</label><select id="npU">
        ${['г','мл','шт','порція'].map(u=>`<option ${v.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
      <div><label class="f">Типова порція</label><input id="npPor" type="number" value="${v.portion}"></div>
    </div>
    <div class="tiny dim" style="margin-top:8px">Для «г» і «мл» цифри нижче вказуй на 100 г/мл. Для «шт» і «порція» — на одну одиницю.</div>
    <div class="f2" style="margin-top:10px">
      <div><label class="f">Калорії</label><input id="npK" type="number" inputmode="decimal" value="${v.kcal}"></div>
      <div><label class="f">Білки, г</label><input id="npP" type="number" inputmode="decimal" value="${v.p}"></div>
    </div>
    <div class="f2" style="margin-top:10px">
      <div><label class="f">Жири, г</label><input id="npF" type="number" inputmode="decimal" value="${v.f}"></div>
      <div><label class="f">Вуглеводи, г</label><input id="npC" type="number" inputmode="decimal" value="${v.c}"></div>
    </div>
    <div class="f2" style="margin-top:10px">
      <div><label class="f">Корисність</label><select id="npH">
        ${[5,4,3,2,1].map(x=>`<option value="${x}" ${v.h===x?'selected':''}>${x} — ${['','задоволення','зрідка','нейтрально','добре','основа раціону'][x]}</option>`).join('')}</select></div>
      <div><label class="f">Категорія</label><select id="npCat">
        ${D.cats.map(c=>`<option ${v.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <button class="btn pri" style="margin-top:14px" onclick="saveProduct('${editId||''}','${ret||''}')">Зберегти</button>
    ${editId?`<button class="btn gh sm" style="margin-top:8px;color:var(--bad)" onclick="delProduct('${editId}')">Видалити продукт</button>`:''}`);
}
function saveProduct(editId,ret){
  const name=document.getElementById('npN').value.trim();
  if(!name){ alert('Вкажи назву.'); return; }
  const id=editId||('c_'+Date.now());
  S.custom[id]={
    name, unit:document.getElementById('npU').value,
    kcal:+document.getElementById('npK').value||0,
    p:+document.getElementById('npP').value||0,
    f:+document.getElementById('npF').value||0,
    c:+document.getElementById('npC').value||0,
    h:+document.getElementById('npH').value||3,
    portion:+document.getElementById('npPor').value||100,
    cat:document.getElementById('npCat').value
  };
  save();
  if(ret==='fromPick'){ renderPick(); } else { closeSheet(); render(); }
}
function delProduct(id){
  if(!confirm('Видалити продукт із бази? Записи в щоденнику збережуться.')) return;
  delete S.custom[id]; S.fav=S.fav.filter(x=>x!==id); save(); closeSheet(); render();
}

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: ВИТРАТИ
   ══════════════════════════════════════════════════════════════════ */
function vSpend(V){
  const d=parse(viewDate);
  setHead('Витрати', DOW[d.getDay()]+', '+human(viewDate));
  const es=S.expense[viewDate]||[];
  const dayTotal=es.reduce((a,e)=>a+(+e.v||0),0);

  let h=`<div class="between" style="margin:12px 0">
    <button class="chip" onclick="shiftDay(-1)">‹ ${human(addDays(viewDate,-1))}</button>
    ${viewDate===TODAY?'<span class="pill">сьогодні</span>':'<button class="chip" onclick="viewDate=TODAY;render()">до сьогодні</button>'}
    <button class="chip" onclick="shiftDay(1)">${human(addDays(viewDate,1))} ›</button>
  </div>`;

  h+=`<div class="card"><div class="between"><span class="muted small">За день</span><b style="font-size:18px">${dayTotal} ₴</b></div></div>`;

  if(es.length){
    h+='<div class="card" style="margin-top:10px;padding:0">';
    es.forEach((e,i)=>{ h+=`<div class="lrow">
      <div class="lname">${esc(e.n)}</div>
      <div class="lqty"><b>${e.v} ₴</b></div>
      <button class="chip" onclick="delSpend(${i})">✕</button></div>`; });
    h+='</div>';
  }
  h+=`<div class="card" style="margin-top:10px">
    <div class="f2"><div><label class="f">На що</label><input id="spN" placeholder="Продукти / шаурма / кола…"></div>
    <div><label class="f">Скільки, ₴</label><input id="spV" type="number" inputmode="decimal" placeholder="0"></div></div>
    <button class="btn pri sm" style="margin-top:10px" onclick="addSpend()">Додати витрату</button>
  </div>`;

  // місячне зведення
  const [y,m]=viewMonth.split('-').map(Number);
  const groups={}; let mTotal=0; const days={};
  for(const date in S.expense){
    if(!date.startsWith(viewMonth)) continue;
    for(const e of S.expense[date]){
      const key=(e.n||'інше').trim().toLowerCase();
      groups[key]=groups[key]||{name:e.n||'інше',v:0,n:0};
      groups[key].v+=+e.v||0; groups[key].n++;
      mTotal+=+e.v||0; days[date]=1;
    }
  }
  h+=`<div class="sect">Зведення за місяць</div>
  <div class="card"><div class="between" style="margin-bottom:8px">
    <button class="chip" onclick="shiftMonth(-1)">‹</button>
    <b>${MONN[m-1]} ${y}</b>
    <button class="chip" onclick="shiftMonth(1)">›</button></div>
    <div class="between"><span class="muted small">Разом (${Object.keys(days).length} дн. із записами)</span><b style="font-size:18px">${Math.round(mTotal)} ₴</b></div>`;
  const gs=Object.values(groups).sort((a,b)=>b.v-a.v);
  if(gs.length){
    h+='<hr><table>';
    for(const g of gs) h+=`<tr><td>${esc(g.name)} <span class="dim tiny">×${g.n}</span></td><td>${Math.round(g.v)} ₴</td></tr>`;
    h+='</table>';
  } else h+='<div class="tiny dim" style="margin-top:8px">У цьому місяці записів немає.</div>';
  h+=`<div class="tiny dim" style="margin-top:10px">Групування — за однаковою назвою. Пиши «продукти» для магазинних закупівель одним рядком, а окремі покупки називай як зручно — «шаурма», «кола» — і в кінці місяця побачиш розбивку.</div></div>`;
  V.innerHTML=h;
}
function addSpend(){
  const n=document.getElementById('spN').value.trim();
  const v=+document.getElementById('spV').value||0;
  if(!n||!v){ alert('Вкажи назву і суму.'); return; }
  (S.expense[viewDate]=S.expense[viewDate]||[]).push({n,v});
  save(); render();
}
function delSpend(i){ S.expense[viewDate].splice(i,1); save(); render(); }
function shiftMonth(n){
  const [y,m]=viewMonth.split('-').map(Number);
  const d=new Date(y,m-1+n,1); viewMonth=iso(d).slice(0,7); render();
}

/* ══════════════════════════════════════════════════════════════════
   ЕКРАН: АНАЛІТИКА
   ══════════════════════════════════════════════════════════════════ */
function vStats(V){
  setHead('Аналітика','Середнє за 7 днів важливіше за один день');
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(TODAY,-i));
  const rows=days.map(d=>({d, t:dayTotals(d), hi:healthIndex(d), target:kcalTarget(d), logged:entries(d).length>0}));
  const logged=rows.filter(r=>r.logged);
  const avgK=logged.length?Math.round(logged.reduce((a,r)=>a+r.t.k,0)/logged.length):0;
  const avgP=logged.length?Math.round(logged.reduce((a,r)=>a+r.t.p,0)/logged.length):0;
  const avgH=logged.length?Math.round(logged.filter(r=>r.hi).reduce((a,r)=>a+r.hi.score,0)/Math.max(1,logged.filter(r=>r.hi).length)):0;
  const max=Math.max(...rows.map(r=>Math.max(r.t.k,r.target)),1);

  let h=`<div class="card" style="margin-top:12px"><div class="row" style="gap:0">
    <div style="flex:1;text-align:center"><b style="font-size:19px">${avgK||'—'}</b><div class="tiny dim">ККАЛ / ДЕНЬ</div></div>
    <div style="flex:1;text-align:center"><b style="font-size:19px">${avgP||'—'}<span class="tiny dim"> г</span></b><div class="tiny dim">БІЛОК</div></div>
    <div style="flex:1;text-align:center"><b style="font-size:19px">${avgH||'—'}</b><div class="tiny dim">ІНДЕКС</div></div>
  </div></div>`;

  h+='<div class="sect">Калорії за 7 днів</div><div class="card"><div class="spark">';
  for(const r of rows){
    const v=r.t.k;
    h+=`<div class="${r.logged?(v>r.target?'over':'hi'):''}" style="height:${Math.max(4,v/max*100)}%" title="${v}"></div>`;
  }
  h+='</div><div class="row" style="margin-top:6px">';
  for(const r of rows) h+=`<div style="flex:1;text-align:center" class="tiny dim">${DOW[parse(r.d).getDay()]}</div>`;
  h+=`</div><div class="tiny dim" style="margin-top:8px">Синім — у межах цілі, жовтим — перебір. Ціль зараз: ${kcalTarget(TODAY)} ккал${(+S.workout[TODAY]||0)?' (з тренуванням)':''}.</div></div>`;

  h+='<div class="card" style="margin-top:10px"><table>';
  for(const r of rows){
    h+=`<tr><td>${DOW[parse(r.d).getDay()]}, ${human(r.d)}</td>
      <td>${r.logged?`<b>${r.t.k}</b> <span class="dim tiny">/ ${r.target}</span>${r.hi?` <span class="tiny" style="color:${r.hi.score>=70?'var(--ok)':r.hi.score>=45?'var(--warn)':'var(--bad)'}">●${r.hi.score}</span>`:''}`:'<span class="dim">—</span>'}</td></tr>`;
  }
  h+='</table></div>';

  // вага
  h+='<div class="sect">Вага</div>';
  const ws=Object.keys(S.weight).sort();
  const last=ws.length?S.weight[ws[ws.length-1]]:null;
  const prev=ws.length>1?S.weight[ws[ws.length-2]]:null;
  h+=`<div class="card"><div class="between">
    <div><b style="font-size:22px">${last?last+' кг':'—'}</b>
      ${prev!=null&&last!=null?`<span class="small" style="margin-left:8px;color:${last<prev?'var(--ok)':'var(--tx2)'}">${last>prev?'+':''}${r1(last-prev)}</span>`:''}
      <div class="tiny dim">${ws.length?'останній запис '+human(ws[ws.length-1]):'записуй раз на 2–3 дні вранці'}</div></div>
    <button class="chip on" onclick="addWeight()">Записати</button></div>`;
  if(ws.length>=2){
    const wmax=Math.max(...ws.map(k=>S.weight[k])), wmin=Math.min(...ws.map(k=>S.weight[k]));
    const span=Math.max(wmax-wmin,1);
    h+='<div class="spark" style="height:44px;margin-top:12px">';
    for(const k of ws.slice(-14)) h+=`<div class="hi" style="height:${8+(S.weight[k]-wmin)/span*90}%" title="${S.weight[k]}"></div>`;
    h+='</div>';
  }
  h+='</div>';

  h+=`<div class="card" style="margin-top:14px"><div class="small muted">Дивись на середнє за 7 днів + динаміку ваги + якість відновлення. Якщо вага поступово знижується, голоду немає і тренування йдуть нормально — все працює. Постійний голод або падіння якості бігу = раціон треба збільшувати, а не радіти дефіциту.</div></div>`;
  V.innerHTML=h;
}
function addWeight(){
  sheet(`<h2 style="font-size:17px;margin-bottom:12px">Вага сьогодні</h2>
    <label class="f">кг</label><input id="wV" type="number" inputmode="decimal" step="0.1" value="${S.weight[TODAY]||''}" placeholder="0,0">
    <button class="btn pri" style="margin-top:14px" onclick="saveWeight()">Зберегти</button>`);
}
function saveWeight(){
  const v=+document.getElementById('wV').value;
  if(v){ S.weight[TODAY]=v; S.profile.weight=v; }   // формула теж оновлюється
  save(); closeSheet(); render();
}

/* ══════════════════════════════════════════════════════════════════
   НАЛАШТУВАННЯ
   ══════════════════════════════════════════════════════════════════ */
function openSettings(){
  const p=S.profile;
  sheet(`<h2 style="font-size:17px;margin-bottom:14px">Налаштування</h2>
    <div class="sect" style="margin-top:0">Профіль для розрахунку норми</div>
    <div class="f3">
      <div><label class="f">Стать</label><select id="stSex">
        <option value="m" ${p.sex==='m'?'selected':''}>чол</option>
        <option value="f" ${p.sex==='f'?'selected':''}>жін</option></select></div>
      <div><label class="f">Вік</label><input id="stAge" type="number" value="${p.age}"></div>
      <div><label class="f">Зріст, см</label><input id="stH" type="number" value="${p.height}"></div>
    </div>
    <div class="f2" style="margin-top:10px">
      <div><label class="f">Вага, кг</label><input id="stW" type="number" step="0.1" value="${p.weight}"></div>
      <div><label class="f">Повсякденна активність</label><select id="stAct">
        <option value="1.2" ${p.activity==1.2?'selected':''}>сидяча</option>
        <option value="1.3" ${p.activity==1.3?'selected':''}>офіс + прогулянки</option>
        <option value="1.4" ${p.activity==1.4?'selected':''}>багато на ногах</option>
      </select></div>
    </div>
    <div class="tiny dim" style="margin-top:8px">Тренування сюди НЕ входять — їх вносиш вручну в щоденнику, і вони додаються до цілі того дня.</div>
    <label class="f" style="margin-top:12px">Режим</label>
    <select id="stMode" onchange="modeHint()">
      ${Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${p.mode===k?'selected':''}>${m.name} (${m.hint})</option>`).join('')}
    </select>
    <div id="modeWarn" class="tiny" style="margin-top:8px;color:var(--warn);${p.mode==='fast'?'':'display:none'}">Швидкий режим погано поєднується з довгими пробіжками: страждає відновлення і якість бігу. Рекомендую «Помірний» або «Середній».</div>
    <div class="card" style="margin-top:12px"><table>
      <tr><td>Базовий обмін (Міффлін–Сан Жеор)</td><td>${bmr()} ккал</td></tr>
      <tr><td>Підтримання (без тренувань)</td><td>${maintain()} ккал</td></tr>
      <tr><td>Денна ціль (${MODES[p.mode].name.toLowerCase()})</td><td><b>${kcalTarget(TODAY)-(+S.workout[TODAY]||0)} ккал</b></td></tr>
      <tr><td>Ціль білка (1,7 г/кг)</td><td>${proteinTarget()} г</td></tr>
    </table><div class="tiny dim" style="margin-top:8px">Нижче за базовий обмін ціль не опускається ніколи.</div></div>
    <button class="btn pri" style="margin-top:12px" onclick="saveSettings()">Зберегти</button>
    <hr>
    <div class="sect" style="margin-top:0">Дані</div>
    <button class="btn" onclick="exportJSON()">⬇ Зберегти резервну копію</button>
    <button class="btn" style="margin-top:8px" onclick="document.getElementById('impF').click()">⬆ Відновити з копії</button>
    <input type="file" id="impF" accept="application/json" class="hide" onchange="importJSON(this)">
    <button class="btn gh sm" style="margin-top:8px;color:var(--bad)" onclick="wipe()">Стерти всі записи</button>
    <div class="tiny dim" style="margin-top:14px">Дані живуть лише на цьому пристрої. База v${D.meta.version} від ${D.meta.updated}. Значення продуктів усереднені — етикетка завжди пріоритетніша.</div>`);
}
function modeHint(){
  document.getElementById('modeWarn').style.display =
    document.getElementById('stMode').value==='fast'?'block':'none';
}
function saveSettings(){
  const p=S.profile;
  p.sex=document.getElementById('stSex').value;
  p.age=+document.getElementById('stAge').value||p.age;
  p.height=+document.getElementById('stH').value||p.height;
  p.weight=+document.getElementById('stW').value||p.weight;
  p.activity=+document.getElementById('stAct').value||1.3;
  p.mode=document.getElementById('stMode').value;
  save(); closeSheet(); render();
}
function dl(name,text,type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportJSON(){ dl('meals-backup-'+TODAY+'.json',JSON.stringify(S,null,2),'application/json'); }
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=JSON.parse(r.result); save(); closeSheet(); render(); alert('Відновлено.'); }
    catch(e){ alert('Не вдалося прочитати файл.'); } };
  r.readAsText(f);
}
function wipe(){ if(confirm('Стерти щоденник, витрати, вагу і власні продукти?')){ S=blank(); save(); closeSheet(); render(); } }

/* ══════════════════════════════════════════════════════════════════
   ДІАЛОГИ / СТАРТ
   ══════════════════════════════════════════════════════════════════ */
function sheet(html){ document.getElementById('sheetContent').innerHTML=html; document.getElementById('sheet').classList.add('open'); }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
setInterval(()=>{ const n=iso(new Date()); if(n!==TODAY){ if(viewDate===TODAY)viewDate=n; TODAY=n; render(); } },60000);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
